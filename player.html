<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarmotDuck Player</title>
  <link rel="icon" href="data:image/x-icon;base64,AA">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Wilson959/player@master/Netflix_3.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    #player { position: absolute; inset: 0; width: 100% !important; height: 100% !important; }
  </style>
</head>
<body>
<div id="player"></div>
<script src="https://cdn.jwplayer.com/libraries/DV3FtaT5.js"></script>
<script>
  (function () {
    const params = new URLSearchParams(window.location.search);
    const videoSrc = params.get("src");

    if (!videoSrc) {
      document.body.innerHTML = "<p style='color:#fff;text-align:center;padding:40px;font-family:sans-serif'>Nenhum vídeo fornecido.</p>";
      return;
    }

    const decode = (val, fallback = "") => val ? decodeURIComponent(val) : fallback;

    const videoSubs    = params.get("subs");
    const videoTitle   = decode(params.get("title"), "Título");
    const subsLabel    = decode(params.get("subsLabel"), "Legenda");

    const tracks = videoSubs ? [{
      file: decode(videoSubs),
      kind: "captions",
      label: subsLabel,
      default: false
    }] : [];

    const player = jwplayer("player").setup({
      file: decode(videoSrc),
      title: videoTitle,
      description: "Estás a assistir",
      tracks,
      controls: true,
      pip: true,
      sharing: false,
      hlshtml: true,
      preload: "none",
      displaytitle: true,
      displaydescription: true,
      abouttext: "",
      aboutlink: "",
      contextmenu: false,
      volume: 100,
      skin: { name: "netflix" },
      // Melhora performance em HLS
      hlsconfig: {
        maxBufferLength: 30,
        maxMaxBufferLength: 60,
        startLevel: -1 // auto qualidade
      }
    });

    player.on("ready", function () {
      player.setCaptions({ mode: "hidden" });

      // Botão download
      player.addButton("", "Download", function () {
        const url = player.getPlaylistItem().file;
        const a = Object.assign(document.createElement("a"), {
          href: url,
          download: url.split("/").pop()
        });
        document.body.appendChild(a);
        a.click();
        a.remove();
      }, "download-video-button");

      // Botão avançar 10s
      const container  = player.getContainer();
      const btnBar     = container.querySelector(".jw-button-container");
      const rwDisplay  = container.querySelector(".jw-display-icon-rewind");
      const rwBar      = btnBar.querySelector(".jw-icon-rewind");

      // Esconde botão next do display central
      const nextDisplay = container.querySelector(".jw-display-icon-next");
      if (nextDisplay) nextDisplay.style.display = "none";

      // Cria botão forward para display central e barra
      [[rwDisplay, ".jw-icon-rewind", true], [rwBar, null, false]].forEach(([ref, selector, isDisplay]) => {
        if (!ref) return;
        const clone = ref.cloneNode(true);
        const btn   = isDisplay ? clone.querySelector(selector) : clone;
        btn.style.transform = "scaleX(-1)";
        btn.ariaLabel = "Avançar 10s";
        btn.onclick = () => player.seek(player.getPosition() + 10);
        ref.parentNode.insertBefore(clone, ref.nextElementSibling);
      });
    });

    // Atalhos de teclado
    document.addEventListener("keydown", function (e) {
      if (e.target.tagName === "INPUT") return;
      switch (e.key) {
        case "ArrowRight": player.seek(player.getPosition() + 10); break;
        case "ArrowLeft":  player.seek(player.getPosition() - 10); break;
        case "ArrowUp":    player.setVolume(Math.min(player.getVolume() + 10, 100)); break;
        case "ArrowDown":  player.setVolume(Math.max(player.getVolume() - 10, 0)); break;
        case " ":
        case "k":
          e.preventDefault();
          player.getState() === "playing" ? player.pause() : player.play();
          break;
        case "m": player.setMute(!player.getMute()); break;
        case "f": player.setFullscreen(!player.getFullscreen()); break;
      }
    });

  })();
</script>
</body>
</html>
